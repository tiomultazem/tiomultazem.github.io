- id: "Mutiara di dasar laut tidak akan bisa diraih kecuali dengan menyelam"
  en: "Pearls at the bottom of the sea cannot be reached except by diving"
  ar: "لا ينال اللؤلؤ في قاع البحر إلا بالغوص"
  credit: "Ir. Soekarno"
  credit_ar: "إير سوكارنو"

- id: "Kapal tidak bisa berjalan di atas daratan"
  en: "A ship does not run on dry land"
  ar: "إن السفينة لا تجري على اليبس"
  credit: "Abul Atahiyah"
  credit_ar: "أبو العتاهية"

- id: "Do finish what you have started"
  en: "Do finish what you have started"
  ar: "أكمل ما بدأته"
  credit: "Colonel Akhilesh Sinha, Commando: A One Man Army (2013)"
  # credit_ar: "العقيد أخيليش سينها"
