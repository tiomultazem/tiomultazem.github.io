items:
  - role_en: "Substitute Imam"
    role_id: "Imam Pengganti"
    organization: "Masjid Al-Umm Tabalong"
    period: "2025 - Present"
    desc_en: "Serving as a substitute Imam for daily prayers."
    desc_id: "Menjadi imam pengganti untuk salat rawatib di Masjid Al-Umm Tabalong."

  - role_en: "Main Imam"
    role_id: "Imam Utama"
    organization: "Masjid Al-Hasanah STIS"
    period: "2024"
    desc_en: "Served as the primary Imam for daily and Friday prayers."
    desc_id: "Menjabat sebagai imam utama untuk salat harian dan Jumat di Masjid Al-Hasanah STIS."

  - role_en: "Vice Class President (4SI2)"
    role_id: "Wakil Ketua Kelas 4SI2"
    organization: "Politeknik Statistika STIS"
    period: "2023 - 2024"
    desc_en: "Assisted in managing class activities and represented the class in the final academic year."
    desc_id: "Membantu mengelola kegiatan kelas dan mewakili mahasiswa tingkat akhir kelas 4SI2."

  - role_en: "Main Instructor (Intama)"
    role_id: "Instruktur Utama (Intama)"
    organization: "PKL STIS"
    period: "2023"
    desc_en: "Managed and coordinated the field organization for the PKL (Field Work Practice) program."
    desc_id: "Mengelola dan mengoordinasikan organisasi lapangan (Intama) untuk kegiatan Praktik Kerja Lapangan (PKL) STIS."

  - role_en: "Processing Coordinator"
    role_id: "Koordinator Pengolahan Riset 1"
    organization: "PKL STIS"
    period: "2022 - 2023"
    desc_en: "Led the data processing division for the first phase of the PKL research program."
    desc_id: "Memimpin divisi pengolahan data untuk Riset 1 pada kegiatan PKL mahasiswa STIS."

  - role_en: "Muadzin"
    role_id: "Muadzin"
    organization: "Masjid Al-Hasanah STIS"
    period: "2023"
    desc_en: "Regularly called to prayers (Adhan) at the campus mosque."
    desc_id: "Rutin mengumandangkan azan untuk salat berjemaah di masjid kampus PPK STIS."

  - role_en: "Class President (2KS2 & 3SI3)"
    role_id: "Ketua Kelas 2KS2 & 3SI3"
    organization: "Politeknik Statistika STIS"
    period: "2021 - 2023"
    desc_en: "Elected as Class President for two consecutive academic years, leading class organization and student representation."
    desc_id: "Terpilih sebagai Ketua Kelas selama dua tahun akademik berturut-turut, memimpin organisasi kelas dan menjembatani aspirasi mahasiswa."

  - role_en: "Public Relations"
    role_id: "Hubungan Masyarakat (Humas)"
    organization: "GPA Cheby"
    period: "2021 - 2023"
    desc_en: "Managed external communications and relations for GPA Cheby, the STIS nature enthusiast organization."
    desc_id: "Mengelola komunikasi dan hubungan eksternal untuk Gerakan Pecinta Alam (GPA) Cheby STIS."

  - role_en: "Mountain & Forest Division"
    role_id: "Divisi Gunung dan Hutan"
    organization: "GPA Cheby"
    period: "2021 - 2023"
    desc_en: "Active member organizing and participating in nature expeditions and outdoor activities."
    desc_id: "Anggota aktif yang mengorganisir dan berpartisipasi dalam ekspedisi alam dan kegiatan alam bebas."

  - role_en: "Volunteer Electronics Repair (Kang Servis)"
    role_id: "Relawan Reparasi Elektronik (KaeS / Kang Servis)"
    organization: "Politeknik Statistika STIS"
    period: "2022 - 2024"
    desc_en: "Known as 'KaeS' (Kang Servis), voluntarily providing 100% free repair services for electronic devices, phones, and laptops for college students."
    desc_id: "Dikenal luas sebagai 'KaeS' (Kang Servis), secara sukarela memberikan layanan reparasi 100% gratis untuk perangkat elektronik, HP, dan laptop mahasiswa STIS."

  - role_en: "Tahfizh Mentor"
    role_id: "Mentor Tahfizh (Angkatan 64 & 65)"
    organization: "Private Mentoring"
    period: "2021 - 2023"
    desc_en: "Mentored two batches of students in Quranic memorization over the span of two years."
    desc_id: "Membimbing dua angkatan santri secara intensif dalam hafalan Al-Qur'an (Tahfizh) selama jangka waktu dua tahun."

  - role_en: "Tahsin Mentor"
    role_id: "Mentor Tahsin (Angkatan 63)"
    organization: "Private Mentoring"
    period: "2021 - 2022"
    desc_en: "Provided guidance on proper Quranic recitation (Tajwid) for one full year."
    desc_id: "Memberikan bimbingan perbaikan bacaan Al-Qur'an (Tahsin dan Tajwid) selama satu tahun penuh."

  - role_en: "Youth Camp Mentor"
    role_id: "Mentor Pesantren Kilat"
    organization: "Jendela Jakarta"
    period: "2022"
    desc_en: "Served as a mentor for a youth camp hosted by the well-known Jakarta-based community, 'Jendela Jakarta'."
    desc_id: "Berperan sebagai mentor pesantren kilat yang diselenggarakan oleh komunitas pemuda terkenal di ibu kota, Jendela Jakarta."

  - role_en: "Youth Camp Mentor"
    role_id: "Mentor Pesantren Kilat"
    organization: "SD Fun Learning Bekasi"
    period: "2022"
    desc_en: "Mentored elementary students during an intensive religious youth camp program."
    desc_id: "Membimbing siswa-siswi sekolah dasar selama program pesantren kilat intensif."

  - role_en: "Vice Class President (1KS4)"
    role_id: "Wakil Ketua Kelas 1KS4"
    organization: "Politeknik Statistika STIS"
    period: "2020 - 2021"
    desc_en: "Assisted the class president in coordinating first-year students."
    desc_id: "Membantu kepengurusan kelas dan mengkoordinasi mahasiswa pada tahun pertama perkuliahan."

  - role_en: "Arabic Grammar Teacher"
    role_id: "Guru Grammar Bahasa Arab"
    organization: "Junior High School (Grade 8-9)"
    period: "2019"
    desc_en: "Taught foundational and intermediate Arabic grammar to middle school students."
    desc_id: "Mengajar tata bahasa (nahwu/sharaf) dasar dan menengah untuk siswa tingkat SMP kelas 8 dan 9."

  - role_en: "Private Quran Tutor"
    role_id: "Mentor Mengaji Privat"
    organization: "Freelance"
    period: "2019 - 2023"
    desc_en: "Provided private tutoring focusing on Quranic reading and basic Tajwid for four years."
    desc_id: "Menyediakan layanan les privat membaca Al-Qur'an dan dasar-dasar ilmu tajwid selama empat tahun."

  - role_en: "Private Arabic Tutor"
    role_id: "Guru Bahasa Arab Privat"
    organization: "Freelance"
    period: "2019 - 2023"
    desc_en: "Tutored individuals in Arabic language skills over the course of four years."
    desc_id: "Membimbing individu secara privat dalam keterampilan berbahasa Arab selama kurun waktu empat tahun."

  - role_en: "Spotify Podcaster"
    role_id: "Podcaster Spotify"
    organization: "Personal Project"
    period: "2019 - Present"
    desc_en: "Host and creator of a podcast running consistently since 2019."
    desc_id: "Host dan kreator podcast audio independen yang dijalankan secara konsisten sejak 2019."
