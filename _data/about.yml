paragraphs:
  - en: "I am Gilang Wahyu Prasetyo, a data analyst and IT support professional with a strong interest in statistics, automation, and backend development."
    id: "Saya Gilang Wahyu Prasetyo, seorang data analyst dan profesional IT support dengan minat kuat di bidang statistik, otomatisasi, dan pengembangan backend."
    ar: "أنا غيلانج وحي فراسيتيو، محلل بيانات ومحترف في دعم تكنولوجيا المعلومات، لدي اهتمام قوي بالإحصاء والأتمتة وتطوير الأنظمة الخلفية."
  - en: "Professionally and during my college years, I go by 'Gilang Tio'—acting as a 'primary key' to distinguish myself from the many other Gilangs and Tios out there. Meanwhile, 'Tio Multazem' is my stage name, widely known across creative platforms like Instagram, X (Twitter), and Spotify."
    id: "Di lingkungan kerja dan perkuliahan, saya biasa dipanggil 'Gilang Tio'—sebagai semacam *primary key* untuk membedakan diri dari banyak 'Gilang' dan 'Tio' lainnya. Sementara itu, 'Tio Multazem' adalah nama panggung saya yang lebih dikenal di platform kreatif seperti Instagram, X (Twitter), maupun Spotify."
    ar: "في بيئة العمل والمجال الأكاديمي، أُعرف باسم 'جيلانج تيو' كـ 'مفتاح أساسي' لأتميز عن الكثير من الأشخاص الذين يحملون اسم جيلانج أو تيو. بينما 'تيو ملتزم' هو اسمي الفني المعروف عبر المنصات الإبداعية مثل إنستغرام وإكس (تويتر) وسبوتيفاي."
  - en: "Currently, I focus on IT-driven problem solving, workflow optimization, and developing technical solutions using Python, JavaScript, and PHP."
    id: "Saat ini, saya fokus pada pemecahan masalah berbasis IT, optimasi alur kerja, dan pengembangan solusi teknis menggunakan Python, JavaScript, dan PHP."
    ar: "حالياً، أركز على حل المشكلات القائم على تكنولوجيا المعلومات، وتحسين سير العمل، وتطوير الحلول التقنية باستخدام لغات بايثون، وجافا سكريبت، وبي إتش بي."
