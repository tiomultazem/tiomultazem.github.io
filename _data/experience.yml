- title_en: "IT Support Officer — BPS - Statistics Indonesia"
  title_id: "Pranata Komputer — Badan Pusat Statistik"
  title_ar: "موظف دعم تكنولوجيا المعلومات — الجهاز المركزي للإحصاء الإندونيسي (BPS)"
  meta_en: "Tabalong, South Kalimantan | Dec 2024 — Present"
  meta_id: "Tabalong, Kalimantan Selatan | Des 2024 — Sekarang"
  meta_ar: "تبالونج، جنوب كاليمانتان | ديسمبر 2024 — الآن"
  desc_en: "Deliver end-to-end IT support covering network, hardware, and system troubleshooting. Develop lightweight applications and automation scripts to streamline workflows, and maintain digital data. Additionally, serve as Team Leader for Distribution Statistics (2025) and Person in Charge of Survey Processing (2025)."
  desc_id: "Memberikan dukungan IT menyeluruh yang mencakup pemecahan masalah jaringan, perangkat keras, dan sistem. Mengembangkan aplikasi ringan dan skrip otomatisasi untuk efisiensi, serta pemeliharaan data digital. Selain itu, juga dipercaya sebagai Ketua Tim Statistik Distribusi (2025) dan PJ Pengolahan Survei (2025)."
  desc_ar: "تقديم دعم تقني شامل يشمل صيانة الشبكات والأجهزة، واستكشاف أخطاء الأنظمة وإصلاحها. وتطوير تطبيقات خفيفة ونصوص أتمتة برمجية لتسهيل سير العمل، وإدارة البيانات الرقمية. كما أعمل كرئيس لفريق إحصاءات التوزيع (2025) ومسؤول معالجة المسح (2025)."

- title_en: "IT & Media Support Intern — BPS - Statistics Indonesia"
  title_id: "Magang IT & Bidang Humas — Badan Pusat Statistik"
  title_ar: "متدرب في دعم تكنولوجيا المعلومات والوسائط — الجهاز المركزي للإحصاء"
  meta_en: "Tulungagung, East Java | Oct 2024 — Nov 2024"
  meta_id: "Tulungagung, Jawa Timur | Okt 2024 — Nov 2024"
  meta_ar: "تولونجاجونج، جاوة الشرقية | أكتوبر 2024 — نوفمبر 2024"
  desc_en: "Delivered operational support across IT and digital communication functions, focusing on hardware maintenance and contributing to social media content management and development."
  desc_id: "Memberikan dukungan operasional di seluruh fungsi IT dan komunikasi digital, berfokus pada pemeliharaan perangkat keras dan berkontribusi pada manajemen serta pengembangan konten media sosial."
  desc_ar: "تقديم الدعم العملياتي عبر وظائف تكنولوجيا المعلومات والاتصالات الرقمية، مع التركيز على صيانة الأجهزة والمساهمة في إدارة وتطوير محتوى وسائل التواصل الاجتماعي."

- title_en: "Operations & Data Intern — BPS - Statistics Indonesia"
  title_id: "Magang Operasional & Data — Badan Pusat Statistik"
  title_ar: "متدرب في العمليات والبيانات — الجهاز المركزي للإحصاء الإندونيسي"
  meta_en: "Tulungagung, East Java | Aug 2023 — Oct 2023"
  meta_id: "Tulungagung, Jawa Timur | Agu 2023 — Okt 2023"
  meta_ar: "تولونجاجونج، جاوة الشرقية | أغسطس 2023 — أكتوبر 2023"
  note_en: "Academic Internship (Credit Conversion Program)"
  note_id: "Magang Akademik (Program Konversi SKS)"
  note_ar: "تدريب أكاديمي (برنامج تحويل الساعات المعتمدة)"
  desc_en: "Supported cross-functional operations across multiple teams, with primary responsibilities in data entry, validation, and data quality control, alongside contributing to social media content creation."
  desc_id: "Mendukung operasi lintas tim, dengan tanggung jawab utama dalam entri data, validasi, dan kontrol kualitas data, sekaligus berkontribusi pada pembuatan konten media sosial."
  desc_ar: "دعم العمليات عبر الفرق المتعددة الوظائف، مع المسؤوليات الأساسية في إدخال البيانات، والتحقق من صحتها، ومراقبة جودة البيانات، إلى جانب المساهمة في إنشاء محتوى وسائل التواصل الاجتماعي."
